<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoA</title>
<link rel="icon" type="image/png" href="/assets/img.png">
<link rel="apple-touch-icon" href="/assets/img.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- 화면 틀. 안의 내용은 모두 JS(views/)가 그립니다 -->
<div class="app" id="app">
  <aside class="side" id="side" aria-label="캘린더 목록"></aside>
  <main class="main" id="main"></main>
  <div id="scrim" class="scrim" hidden></div>
  <section class="panel" id="panel" aria-label="날짜 기록" hidden></section>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<!--
  스크립트는 아래 순서대로 읽힙니다. 모두 같은 전역 범위를 함께 씁니다.
  도구·상수 → 상태(store) → 조회(queries) → 화면 그리기(views) → 동작(actions 등) → 이벤트 연결 → 시작(main)
-->
<script src="/js/utils.js"></script>
<script src="/js/constants.js"></script>
<script src="/js/store.js"></script>
<script src="/js/queries.js"></script>
<script src="/js/views/sidebar.js"></script>
<script src="/js/views/calendar.js"></script>
<script src="/js/views/years.js"></script>
<script src="/js/views/browse.js"></script>
<script src="/js/views/panel.js"></script>
<script src="/js/views/render.js"></script>
<script src="/js/media.js"></script>
<script src="/js/actions.js"></script>
<script src="/js/ai.js"></script>
<script src="/js/dialogs.js"></script>
<script src="/js/events.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
